services:
  postgres:
    image: postgres:16-alpine
    container_name: tickopsy-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tickopsy
      POSTGRES_PASSWORD: tickopsy
      POSTGRES_DB: tickopsy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickopsy"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
